name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cai Capacitor
        run: npm install

      - name: Chuan bi web (tai thu vien vao app)
        run: node scripts/prepare.mjs

      - name: Tao project Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Them quyen micro (voice chat) va dat so phien ban
        run: |
          MF=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />#' "$MF"
          grep -q RECORD_AUDIO "$MF" || (echo "Khong them duoc quyen micro" && exit 1)
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
   
      - name: Dat icon hoa sen
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            R=android/app/src/main/res/mipmap-$d
            cp icons/launcher-$d.png "$R/ic_launcher.png"
            cp icons/launcher-$d.png "$R/ic_launcher_round.png"
            cp icons/foreground-$d.png "$R/ic_launcher_foreground.png"
          done
      - name: Che do toan man hinh (an thanh trang thai va thanh dieu huong)
        run: |
          MA=$(find android/app/src/main/java -name MainActivity.java | head -1)
          PKG=$(grep -m1 '^package ' "$MA")
          cat > "$MA" <<EOF2
          $PKG

          import android.os.Build;
          import android.os.Bundle;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              if (Build.VERSION.SDK_INT >= 28) {
                WindowManager.LayoutParams lp = getWindow().getAttributes();
                lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                getWindow().setAttributes(lp);
              }
              hideBars();
            }

            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) hideBars();
            }

            private void hideBars() {
              WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
              c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
              c.hide(WindowInsetsCompat.Type.systemBars());
            }
          }
          EOF2
          sed -i 's/^          //' "$MA"
          cat "$MA"
      - name: Dung khoa ky co dinh (de cap nhat cai de duoc len ban cu)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Doi ten file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TinhTamTu.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TinhTamTu-apk
          path: TinhTamTu.apk
